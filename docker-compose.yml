version: '3.8'

services:
  # Shared MySQL Database
  mysql:
    image: mysql:8.0
    container_name: joker_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend_dev}
      MYSQL_USER: ${MYSQL_USER:-joker_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joker_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - joker_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for async queue
  redis:
    image: redis:7-alpine
    container_name: joker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - joker_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Auth Service (Port 8080)
  auth-service:
    build:
      context: ./services/authService
      dockerfile: Dockerfile
    container_name: joker_auth_service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-joker_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joker_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend_dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
      ENV: ${ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      IS_LOCAL: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - joker_network
    restart: unless-stopped

  # Tower Defense Game Service (Port 18082)
  td-service:
    build:
      context: .
      dockerfile: services/tdService/Dockerfile
    container_name: joker_td_service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-joker_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-joker_password}
      DB_NAME: ${TD_DATABASE:-td_service}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 18082
      ENV: ${ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-joker-jwt-secret-key}
      WS_BASE_URL: ${WS_BASE_URL:-ws://localhost:18082/ws}
    ports:
      - "18082:18082"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - joker_network
    restart: unless-stopped

  # Cloud Repository Service (Port 18080)
  cloud-repository-service:
    build:
      context: ./services/cloudRepositoryService
      dockerfile: Dockerfile
    container_name: joker_cloud_repository_service
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-joker_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joker_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joker_db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 18080
      ENV: ${ENV:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      IS_LOCAL: "true"
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      CLOUD_REPOSITORY_BUCKET: ${CLOUD_REPOSITORY_BUCKET:-joker-cloud-repository-dev}
      JWT_SECRET: ${JWT_SECRET:-joker-jwt-secret-key}
      REDIS_HOST: redis:6379
      REDIS_PASSWORD: ""
    ports:
      - "18080:18080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - joker_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:18080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Payment Service (Port 6002) - Placeholder
  # Uncomment when ready to use
  # payment-service:
  #   build:
  #     context: ./services/payment-service
  #     dockerfile: Dockerfile
  #   container_name: joker_payment_api
  #   environment:
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_USER: joker_user
  #     DB_PASSWORD: joker_password
  #     DB_NAME: backend_dev
  #     LOG_LEVEL: info
  #     PORT: 6002
  #   ports:
  #     - "6002:6002"
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   networks:
  #     - joker_network
  #   restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  joker_network:
    driver: bridge
